name: Test OpenDART connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run OpenDART connectivity test
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/test_opendart.py
