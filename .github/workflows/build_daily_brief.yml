name: Build daily brief

on:
  workflow_dispatch:
  schedule:
    # After both KR and US snapshots are expected to be available.
    - cron: "0 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: build-daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build daily brief
        run: python scripts/build_daily_brief.py

      - name: Commit daily brief
        run: |
          git add data/brief/daily_brief.json

          if git diff --cached --quiet; then
            echo "No daily brief changes."
            exit 0
          fi

          git config user.name "stock-news-radar-bot"
          git config user.email "stock-news-radar-bot@users.noreply.github.com"
          git commit -m "Update daily brief"
          git pull --rebase origin main
          git push
