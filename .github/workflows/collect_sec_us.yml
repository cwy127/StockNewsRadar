name: Collect US SEC radar

on:
  workflow_dispatch:
  schedule:
    # US premarket / morning / afternoon sampling on weekdays.
    - cron: "0 7,10,13,16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: collect-sec-us
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Collect SEC filings and market data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/collect_sec_us.py

      - name: Commit US live data
        run: |
          git add data/live_us.json

          if git diff --cached --quiet; then
            echo "No US data changes."
            exit 0
          fi

          git config user.name "stock-news-radar-bot"
          git config user.email "stock-news-radar-bot@users.noreply.github.com"
          git commit -m "Update US SEC radar"
          git push
