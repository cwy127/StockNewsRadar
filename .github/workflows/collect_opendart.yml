name: Collect Korean stock disclosures

on:
  workflow_dispatch:
  schedule:
    # Korea morning: every 15 min, 06:00-08:59 KST on weekdays
    - cron: "*/15 6-8 * * 1-5"
      timezone: "Asia/Seoul"
    # Korea post-close/evening: every 30 min, 15:00-23:59 KST on weekdays
    - cron: "0,30 15-23 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: collect-opendart
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect OpenDART disclosures
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/collect_opendart.py

      - name: Commit updated live data
        run: |
          if git diff --quiet -- data/live_kr.json; then
            echo "No live data changes."
            exit 0
          fi
          git config user.name "stock-news-radar-bot"
          git config user.email "stock-news-radar-bot@users.noreply.github.com"
          git add data/live_kr.json
          git commit -m "Update Korean disclosure radar"
          git push
