name: Collect Korean stock disclosures

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 6-8 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "0,30 15-23 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: collect-opendart
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Collect OpenDART disclosures and market data
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python scripts/collect_opendart.py

      - name: Commit updated live data
        run: |
          git add data/live_kr.json

          if git diff --cached --quiet; then
            echo "No live data changes."
            exit 0
          fi

          git config user.name "stock-news-radar-bot"
          git config user.email "stock-news-radar-bot@users.noreply.github.com"
          git commit -m "Update Korean disclosure radar"
          git push
