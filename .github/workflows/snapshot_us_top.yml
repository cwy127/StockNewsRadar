name: Snapshot US TOP candidates

on:
  workflow_dispatch:
  schedule:
    # After SEC 16:00 ET collector and 16:15 ET news collector.
    - cron: "30 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: snapshot-us-top
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Save US TOP candidates
        run: python scripts/snapshot_us_top_candidates.py

      - name: Commit US TOP snapshot
        run: |
          git add data/history/top_us/

          if git diff --cached --quiet; then
            echo "No US TOP snapshot changes."
            exit 0
          fi

          git config user.name "stock-news-radar-bot"
          git config user.email "stock-news-radar-bot@users.noreply.github.com"
          git commit -m "Save US daily TOP snapshot"
          git pull --rebase origin main
          git push
