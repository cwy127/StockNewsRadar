name: Build persistence performance

on:
  workflow_dispatch:
  schedule:
    # Run after daily validation, candidate history, and analysis have updated.
    - cron: "45 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: build-persistence-performance
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build persistence performance analysis
        run: python scripts/build_persistence_performance.py

      - name: Commit persistence analysis
        run: |
          git add data/analysis/persistence_performance.json

          if git diff --cached --quiet; then
            echo "No persistence analysis changes."
            exit 0
          fi

          git config user.name "stock-news-radar-bot"
          git config user.email "stock-news-radar-bot@users.noreply.github.com"
          git commit -m "Update persistence performance analysis"
          git pull --rebase origin main
          git push
