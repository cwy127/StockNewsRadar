name: Collect US news layer

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7,10,13,16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: collect-us-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect US news
        run: python scripts/collect_us_news.py

      - name: Commit US news data
        run: |
          git add data/news_us.json

          if git diff --cached --quiet; then
            echo "No US news changes."
            exit 0
          fi

          git config user.name "stock-news-radar-bot"
          git config user.email "stock-news-radar-bot@users.noreply.github.com"
          git commit -m "Update US news layer"
          git pull --rebase origin main
          git push
